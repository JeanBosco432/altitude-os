name: Deploy ALTITUDE Trade V7 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runtime
        run: bash scripts/verify.sh

      - name: Prepare static site
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          BILLING_ENABLED: ${{ vars.BILLING_ENABLED }}
        run: |
          rm -rf _site
          mkdir -p _site/src _site/assets
          cp index.html favicon.svg manifest.webmanifest sw.js CNAME _site/
          cp src/styles.css src/main.js _site/src/
          cp -R assets/. _site/assets/
          cat > _site/config.js <<CONFIG
          window.ALTITUDE_CONFIG = {
            SUPABASE_URL: '${SUPABASE_URL}',
            SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY}',
            APP_URL: '${APP_URL}',
            BILLING_ENABLED: '${BILLING_ENABLED}' === 'true'
          };
          CONFIG

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
